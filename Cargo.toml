[package]
name = "ninho"
version = "0.7.0"
edition = "2024"
description = "Free, portable local server for Windows: Apache, MySQL, PHP, Node.js and Mailpit from one control panel (XAMPP, WampServer and Laragon alternative)."
license = "MIT OR GPL-3.0-only"
repository = "https://github.com/phmrmkv/Ninho"
keywords = ["local-server", "xampp", "wamp", "laragon", "php"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = { version = "0.26.1", default-features = false }

# Linux (preview): the window needs a display backend (X11 and Wayland), and the tray icon talks D-Bus (ksni)
# instead of GTK, so building needs no extra system libraries.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
opt-level = 2
