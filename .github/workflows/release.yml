# Pushing a tag like v0.5.0 builds Ninho for 64-bit and 32-bit Windows and publishes both on the GitHub release:
#   Ninho-x64.exe  (Windows 10/11 64-bit)
#   Ninho-x86.exe  (32-bit Windows; some servers have no 32-bit build, Ninho says which)
# The C runtime is linked in (crt-static), so each exe runs on a clean Windows with nothing to install.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: Ninho-x64.exe
          - target: i686-pc-windows-msvc
            name: Ninho-x86.exe
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Test (64-bit only)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name the exe
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/ninho.exe ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: SHA-256 of each file
        run: sha256sum Ninho-*.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Ninho-x64.exe
            Ninho-x86.exe
            SHA256SUMS.txt
          generate_release_notes: true
